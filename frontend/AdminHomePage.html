  function renderPieChart(students, faculty) {
    const ctx = document.getElementById('pieChart').getContext('2d');
    if (pieChart) pieChart.destroy();

    pieChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Students', 'Faculty'],
            datasets: [{
                data: [students, faculty],
                backgroundColor: ['#0d6efd', '#198754'],
                borderColor: '#fff',
                borderWidth: 5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '70%',
            plugins: {
                legend: { position: 'bottom' },
                tooltip: { callbacks: { label: (ctx) => ctx.raw + " (" + Math.round(ctx.raw/(students+faculty)*100) + "%)" }}
            }
        }
    });
  }

    // Simple toast/notification helper
    function showToast(type, message, title) {
      // type: 'success' | 'error' | 'info'
      title = title || (type === 'success' ? 'Success' : type === 'error' ? 'Error ' : 'Info ');

      let container = document.getElementById('toastContainer');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toastContainer';
        container.className = 'toast-container';
        document.body.appendChild(container);
      }

      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<div class="title">${title}</div><div class="msg">${message}</div>`;
      container.appendChild(toast);

      // Force reflow then show
      requestAnimationFrame(() => toast.classList.add('show'));

      // Auto remove after 4 seconds
      const timeout = setTimeout(() => {
        toast.classList.remove('show');
        toast.addEventListener('transitionend', () => toast.remove(), { once: true });
      }, 4000);

      // Click to dismiss early
      toast.addEventListener('click', () => {
        clearTimeout(timeout);
        toast.classList.remove('show');
        toast.addEventListener('transitionend', () => toast.remove(), { once: true });
      });

      return toast;
    }

    function updateTotals() {
      const rows = document.querySelectorAll('#feeTable tbody tr:not(.total-row)');
      let totalFees = 0;
      let totalPaid = 0;
      let totalBalance = 0;

      rows.forEach(row => {
        const cells = row.querySelectorAll('td.editable');
        const feesText = cells[1].textContent.trim();
        const paidText = cells[2].textContent.trim();
        const fees = parseFloat(feesText) || 0;
        const paid = parseFloat(paidText) || 0;
        const balance = fees - paid;
        cells[3].textContent = feesText || paidText ? balance.toFixed(2) : '';
        totalFees += fees;
        totalPaid += paid;
        totalBalance += balance;
      });

      // Update Total row
      const totalFeesCell = document.getElementById('totalFees');
      const totalPaidCell = document.getElementById('totalPaid');
      const totalBalanceCell = document.getElementById('totalBalance');

      if (totalFeesCell && totalPaidCell && totalBalanceCell) {
        totalFeesCell.textContent = totalFees.toFixed(2);
        totalPaidCell.textContent = totalPaid.toFixed(2);
        totalBalanceCell.textContent = totalBalance.toFixed(2);
      } else {

    }

        const programName = document.getElementById('sectionSelect') ? document.getElementById('sectionSelect').value : '';

        const items = rows.map(row => {
          const cells = row.querySelectorAll('td');
          return {
            programName: programName,

            fees: parseFloat((cells[2]?.textContent || '').replace(/,/g, '')) || 0,
            paid: parseFloat((cells[3]?.textContent || '').replace(/,/g, '')) || 0,

          };
        });

        return items; // Return array of items matching MyFee_Entity structure
      }

    async function sendAdminMail(form, files) {
      const type = document.getElementById('recipient-type')?.value;
      const lookup = document.getElementById('individual-input')?.value?.trim() || '';
      const senderName = localStorage.getItem('adminName') || localStorage.getItem('profileName') || 'Admin';
      const senderId = localStorage.getItem('profileRegNo') || localStorage.getItem('currentAdminProfileId') || 'ADMIN';
      const attachments = await Promise.all((files || []).map(async file => ({
        fileName: file.name,
        contentType: file.type || 'application/octet-stream',
        size: file.size,
        data: await fileToMailData(file)
      })));

      if (!type) throw new Error('Select a recipient type.');
      if (type === 'individual' && !lookup) throw new Error('Enter a name, email, or register ID.');

      const normalizeText = (value) => String(value ?? '').trim();
      const addTargets = (items, role) => {
        (items || []).forEach(item => {
          const registeredId = normalizeText(item.registerNo || item.registerNumber || item.registrationNumber || item.id);
          const email = normalizeText(item.email);
          const name = normalizeText(item.name || item.fullName || item.username || item.firstName || registeredId || email);
          const targetId = registeredId || email;

          if (!targetId) return;

          targets.push({
            role,
            id: targetId,
            name: name || targetId
          });
        });
      };

      const targets = [];

      const fetchStudentTargets = async () => {
        const endpoint = type === 'individual'
          ? `${API3}/Admin/Admin-Students/search?query=${encodeURIComponent(lookup)}`
          : `${API3}/Admin/Admin-Students/all`;
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error(`Student lookup failed (HTTP ${response.status})`);
        addTargets(await response.json(), 'STUDENT');
      };

      const fetchFacultyTargets = async () => {
        const endpoint = type === 'individual'
          ? `${API8}/Admin/Admin_Faculty/search?query=${encodeURIComponent(lookup)}`
          : `${API8}/Admin/Admin_Faculty/all`;
        const response = await fetch(endpoint);
        if (!response.ok) throw new Error(`Faculty lookup failed (HTTP ${response.status})`);
        addTargets(await response.json(), 'FACULTY');
      };

      if (type === 'student' || type === 'all' || type === 'individual') {
        await fetchStudentTargets();
      }

      if (type === 'faculty' || type === 'all' || type === 'individual') {
        await fetchFacultyTargets();
      }

      const uniqueTargets = [...new Map(targets.map(target => [`${target.role}:${target.id.toLowerCase()}`, target])).values()];
      if (!uniqueTargets.length) {
        throw new Error('No recipients found for the selected type.');
      }

      const subject = form.querySelector('[name="subject"]').value.trim();
      const body = form.querySelector('[name="description"]').value.trim();

      await Promise.all(uniqueTargets.map(async target => {
        const response = await fetch('http://localhost:9110/portal/mail/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            senderRole: 'ADMIN',
            senderName,
            senderId,
            recipientRole: target.role,
            recipientName: target.name,
            recipientId: target.id,
            subject,
            body,
            attachments
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(errText || `HTTP ${response.status}`);
        }
      }));

      return uniqueTargets.length;
    }

    function setupAllEmailLogic(formId, fileInputId, attachedFilesId, setupShareLogicCallback) {
      // Get DOM elements
      const fileInputAll = document.getElementById(fileInputId);
      const attachedFilesDivAll = document.getElementById(attachedFilesId);
      const formAll = document.getElementById(formId);
      const modalAll = document.getElementById('image-modal-all');
      const modalImageAll = document.getElementById('modal-image-all');
      const modalCloseAll = document.querySelector('#image-modal-all .modal-close');
      const shareButtonAll = formAll.querySelector('.share-btn');
      const draftButtonAll = formAll.querySelector('.draft-btn');
      const draftCountAll = document.getElementById('draft-count-all');
      const draftModalAll = document.getElementById('draft-modal-all');
      const draftModalCloseAll = document.getElementById('draft-modal-close-all');
      const draftListAll = document.getElementById('draft-list-all');
      let attachedFilesAll = [];
      let draftsAll = JSON.parse(localStorage.getItem('allEmailDrafts')) || [];
      let isSendingAll = false;
      const previewUrlsAll = new Map();

      // Update draft count badge
      function updateDraftCountAll() {
        draftCountAll.textContent = draftsAll.length;
        draftCountAll.style.display = draftsAll.length > 0 ? 'inline-block' : 'none';
      }

      // Initialize draft count
      updateDraftCountAll();

      // Update share button state
      function updateShareButtonStateAll() {
        const subject = formAll.querySelector('input[name="subject"]').value.trim();
        const description = formAll.querySelector('textarea[name="description"]').value.trim();
        shareButtonAll.disabled = !(subject || description || attachedFilesAll.length > 0);
      }

      // Convert file to base64
      async function fileToBase64All(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('Failed to read file'));
          reader.readAsDataURL(file);
        });
      }

      // Convert base64 to File
      function base64ToFileAll(base64, filename, mimeType) {
        const byteString = atob(base64.split(',')[1]);
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
          ia[i] = byteString.charCodeAt(i);
        }
        return new File([ab], filename, { type: mimeType });
      }

      // Save draft
      async function saveDraftAll() {
        const subject = formAll.querySelector('input[name="subject"]').value.trim();
        const description = formAll.querySelector('textarea[name="description"]').value.trim();
        if ((subject || description || attachedFilesAll.length > 0) && !isSendingAll) {
          const fileData = await Promise.all(
            attachedFilesAll.map(async file => ({
              name: file.name,
              type: file.type,
              size: file.size,
              data: await fileToBase64All(file)
            }))
          );
          const draft = {
            id: Date.now(),
            subject,
            description,
            files: fileData,
            timestamp: new Date().toISOString()
          };
          draftsAll = draftsAll.filter(d => d.subject !== subject || d.description !== description);
          draftsAll.push(draft);
          localStorage.setItem('allEmailDrafts', JSON.stringify(draftsAll));
          updateDraftCountAll();
        }
      }

      // Display drafts
      function displayDraftsAll() {
        draftListAll.innerHTML = '';
        draftsAll.forEach((draft, index) => {
          const draftElement = document.createElement('div');
          draftElement.classList.add('draft-item');
          const fileNames = draft.files.map(file => file.name).join(', ');
          const descriptionPreview = draft.description ? draft.description.split('\n')[0].substring(0, 50) + (draft.description.length > 50 ? '...' : '') : 'No Content';
          draftElement.innerHTML = `
            <div class="draft-content">
              <strong>${draft.subject || 'No Subject'}</strong>
              <p>${descriptionPreview}</p>
              ${draft.files.length > 0 ? `<small>Files: ${fileNames}</small>` : ''}
              <small>${new Date(draft.timestamp).toLocaleString()}</small>
            </div>
            <div class="draft-actions">
              <button class="load-draft" data-index="${index}">re-write</button>
              <button class="delete-draft" data-index="${index}">Delete</button>
            </div>
          `;
          draftListAll.appendChild(draftElement);
        });

        // Event listeners for draft actions
        draftListAll.addEventListener('click', async (e) => {
          const loadButton = e.target.closest('.load-draft');
          const deleteButton = e.target.closest('.delete-draft');
          if (loadButton) {
            const index = parseInt(loadButton.dataset.index, 10);
            const draft = draftsAll[index];
            formAll.querySelector('input[name="subject"]').value = draft.subject || '';
            formAll.querySelector('textarea[name="description"]').value = draft.description || '';
            attachedFilesAll = await Promise.all(
              draft.files.map(file => base64ToFileAll(file.data, file.name, file.type))
            );
            updateAttachedFilesDisplayAll();
            updateShareButtonStateAll();
            draftModalAll.style.display = 'none';
          }
          if (deleteButton) {
            const index = parseInt(deleteButton.dataset.index, 10);
            draftsAll.splice(index, 1);
            localStorage.setItem('allEmailDrafts', JSON.stringify(draftsAll));
            updateDraftCountAll();
            displayDraftsAll();
          }
        });
      }

      // Handle file selection

          modalFaculty.style.display = 'none';
          URL.revokeObjectURL(modalImageFaculty.srcB);
        }
      });

      // Handle form submission
      formFaculty.addEventListener('submit', async (event) => {
        event.preventDefault();
        isSendingFaculty = true;
        const formData = new FormData(formFaculty);
        attachedFilesFaculty.forEach((file, index) => {
          formData.append(`file${index}`, file);
        });
        console.log('Form Data:', Object.fromEntries(formData));
        draftsFaculty = draftsFaculty.filter(d => d.subject !== formFaculty.querySelector('input[name="subject"]').value || 
                                                d.description !== formFaculty.querySelector('textarea[name="description"]').value);
        localStorage.setItem('facultyEmailDrafts', JSON.stringify(draftsFaculty));
        updateDraftCountFaculty();
        formFaculty.reset();
        attachedFilesFaculty = [];
        updateAttachedFilesDisplayFaculty();
        updateShareButtonStateFaculty();
        isSendingFaculty = false;
      });

      // Clear attached files on form reset
      formFaculty.addEventListener('reset', () => {
        attachedFilesFaculty = [];
        previewUrlsFaculty.forEach(url => URL.revokeObjectURL(url));
        previewUrlsFaculty.clear();
        updateAttachedFilesDisplayFaculty();
        updateShareButtonStateFaculty();
      });

      // Initialize share button
      updateShareButtonStateFaculty();

      // Set up share logic
      setupShareLogicCallback(attachedFilesFaculty);
    }

    // Share logic for All Email
    function setupShareLogicAll(attachedFilesAll) {
      const form = document.getElementById('AllEmailForm');
      const shareButton = form.querySelector('.share-btn');
      const shareModal = document.getElementById('share-modal-all');
      const closeModal = document.getElementById('share-modal-close-all');
      const shareConfirm = document.getElementById('share-confirm-all');
      const shareOptions = document.querySelectorAll('#share-modal-all .share-option');
      let selectedPlatform = null;

      shareButton.addEventListener('click', () => {
        const subject = form.querySelector('input[name="subject"]').value.trim();
        const description = form.querySelector('textarea[name="description"]').value.trim();
        if (!subject && !description && attachedFilesAll.length === 0) {
          alert('Please add a subject, description, or file to share.');
          return;
        }
        if (!shareButton.disabled) {
          shareModal.style.display = 'flex';
        }
      });

      closeModal.addEventListener('click', () => {
        shareModal.style.display = 'none';
        selectedPlatform = null;
        shareOptions.forEach(option => option.classList.remove('selected'));
      });

      shareModal.addEventListener('click', (e) => {
        if (e.target === shareModal) {
          shareModal.style.display = 'none';
          selectedPlatform = null;
          shareOptions.forEach(option => option.classList.remove('selected'));
        }
      });

      shareOptions.forEach(option => {
        option.addEventListener('click', () => {
          shareOptions.forEach(opt => opt.classList.remove('selected'));
          option.classList.add('selected');
          selectedPlatform = option.getAttribute('data-platform');
        });
      });

      shareConfirm.addEventListener('click', async () => {
        if (!selectedPlatform) {
          alert('Please select a platform to share.');
          return;
        }

        const subject = form.querySelector('input[name="subject"]').value || 'No Subject';
        const description = form.querySelector('textarea[name="description"]').value || 'No Description';
        let shareText = `${subject}\n\n${description}`;

        let fileLinks = '';
        let filesToShare = [];
        if (attachedFilesAll.length > 0) {
          fileLinks = '\n\nAttached Files:\n';
          filesToShare = await Promise.all(
            attachedFilesAll.map(async file => {
              try {
                if (file.size > 5 * 1024 * 1024) { // 5MB limit for sharing
                  fileLinks += `${file.name}: [File too large to share]\n`;
                  return null;
                }
                const fileDataUrl = await fileToBase64All(file);
                fileLinks += `${file.name}: [Attachment]\n`;
                return { file, dataUrl: fileDataUrl };
              } catch (error) {
                console.error('Error converting file to data URL:', error);
                fileLinks += `${file.name}: [Error processing file]\n`;
                return null;
              }
            })
          );
          filesToShare = filesToShare.filter(file => file !== null);
        }

        shareText += fileLinks;

        switch (selectedPlatform) {
          case 'whatsapp':
            if (shareText.length > 2000) {
              alert('Content exceeds WhatsApp character limit (2000). Please shorten the message.');
              return;
            }
            if ('share' in navigator && filesToShare.length > 0) {
              const shareData = {
                title: subject,
                text: description,
                files: filesToShare.map(item => item.file)
              };
              try {
                await navigator.share(shareData);
              } catch (error) {
                console.error('Error sharing via Web Share API:', error);
                alert('Failed to share via WhatsApp. Please try again.');
              }
            } else {
              const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
              window.open(whatsappUrl, '_blank');
            }
            break;

          case 'x':
            if (shareText.length > 280) {
              alert('Content exceeds X character limit (280). Please shorten the message.');
              return;
            }
            const xUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
            window.open(xUrl, '_blank');
            break;

          case 'gmail':
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(shareText)}`;
            window.open(gmailUrl, '_blank');
            break;

          case 'outlook':
            const outlookUrl = `https://outlook.live.com/mail/0/deeplink/compose?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(shareText)}`;
            window.open(outlookUrl, '_blank');
            break;

          default:
            alert('Invalid platform selected.');
            return;
        }

        shareModal.style.display = 'none';
        selectedPlatform = null;
        shareOptions.forEach(option => option.classList.remove('selected'));
      });
    }

    //Logout Logic
    document.addEventListener('DOMContentLoaded', function() {

      const logoutBtn = document.getElementById('logoutBtn');

      if (logoutBtn) {
          logoutBtn.addEventListener('click', function(e) {
              e.preventDefault();

    function performLogout() {
      try {
          // Clear any minimal data you might have saved
          localStorage.removeItem('currentAdminProfileId'); 

          showToast('success', 'Logged out successfully!', 'Logout');

          setTimeout(() => {
              window.location.href = './Form/AdminLogin.html'; 
          }, 1000);

      } catch (error) {
          console.error("Logout error:", error);
          showToast('error', 'Something went wrong during logout.');

          setTimeout(() => {
              window.location.href = './AdminEditProfile.html';
          }, 1500);
      }
    }
  
  
    function handleAddFacultyForm() {
      const form = document.getElementById("addFacultyForm");
      if (!form) return;

      form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const payload = {
              name: document.getElementById('name').value.trim(),
              registerNo: document.getElementById('registerno').value.trim(),   // Must match entity field
              email: document.getElementById('facultyEmail').value.trim(),
              section: document.getElementById('section').value.trim()
          };

          try {
              const response = await fetch('http://localhost:9102/Admin/Admin_Faculty/Admin_Faculty', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
              });

              if (response.ok) {
                  showToast('success', 'Faculty added successfully!');
                  form.reset();
              } else {
                  const errorText = await response.text().catch(() => '');
                  console.error("Server Error:", errorText);
                  showToast('error', 'Failed to add faculty. Please check input.');
              }
          } catch (err) {
              console.error('Network error:', err);
              showToast('error', 'Network error: Cannot connect to server (Check if backend is running on port 9102)');
          }
      });
  }

              if (m !== menu) m.classList.remove('show');
          });
