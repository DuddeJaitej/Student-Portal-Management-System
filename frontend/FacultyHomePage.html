    function showFacultyToast(message, type = 'success') {
      let toast = document.getElementById('facultyToast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'facultyToast';
        toast.className = 'faculty-toast';
        document.body.appendChild(toast);
      }

      toast.textContent = message;
      toast.className = `faculty-toast faculty-toast-${type} faculty-toast-visible`;
      clearTimeout(showFacultyToast.timeout);
      showFacultyToast.timeout = setTimeout(() => {
        toast.classList.remove('faculty-toast-visible');
      }, 4000);
    }

    async function refreshFacultyProfile() {
      const registerNo = localStorage.getItem('registerNumber') || localStorage.getItem('profileRegNo');
      if (!registerNo) return;

      try {
        const response = await fetch(`${FACULTY_PROFILE_API}/by-reg/${encodeURIComponent(registerNo)}`);
        if (!response.ok) return;
        const faculty = await response.json();
        localStorage.setItem('facultyName', faculty.name || '');
        localStorage.setItem('profileName', faculty.name || '');
        localStorage.setItem('profileEmail', faculty.email || '');
        localStorage.setItem('profilePhone', faculty.phone || '');
        localStorage.setItem('profileRegNo', faculty.registerNo || registerNo);
        localStorage.setItem('registerNumber', faculty.registerNo || registerNo);
        updateHeaderProfile();

        const fields = {
          profileName: faculty.name || 'N/A',
          profileEmail: faculty.email || 'N/A',
          profilePhone: faculty.phone || 'N/A',
          profileRegNo: faculty.registerNo || registerNo,
          profileSection: faculty.section || 'N/A'
        };
        Object.entries(fields).forEach(([id, value]) => {
          const element = document.getElementById(id);
          if (element) element.textContent = value;
        });
      } catch (error) {
        console.error('Faculty profile refresh failed:', error);
      }
    }

    const AttendanceUrl = "http://localhost:9098/Admin/Admin-Students/section/";

    let students = [];
    let facultyAssignments = [];

    function getSelectedAssignment() {
      const courseName = document.getElementById('attendanceCourse')?.value || '';
      return facultyAssignments.find(course => course.courseName === courseName) || null;
    }

    function switchAttendanceTab(tab) {
        document.getElementById('markAttendanceTab').style.display = tab === 'mark' ? 'block' : 'none';
        document.getElementById('viewAttendanceTab').style.display = tab === 'view' ? 'block' : 'none';
        document.querySelectorAll('.attendance-tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.attendance-tab-btn[data-tab="${tab}"]`).classList.add('active');

        if (tab === 'view') {
            loadAttendanceRecords();
        }
    }

    async function loadAttendanceRecords() {
        const recordsContainer = document.getElementById('attendanceRecordsList');
        const facultyName = localStorage.getItem('facultyName') || localStorage.getItem('profileName') || 'Faculty';
        const section = getSelectedAssignment()?.section || '';
        const course = document.getElementById('attendanceCourse').value.trim() || '';
        const date = document.getElementById('filterDate').value;

        recordsContainer.innerHTML = '<p>Loading records...</p>';

        try {
            const params = new URLSearchParams({
                facultyRegisterNumber: localStorage.getItem('registerNumber') || localStorage.getItem('profileRegNo') || '',
                section: section,
                courseName: course
            });
            if (date) params.append('date', date);

            const response = await fetch(`${PORTAL_API}/attendance/faculty?${params.toString()}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const records = await response.json();
            if (!records.length) {
                recordsContainer.innerHTML = '<p>No attendance records found for the selected criteria.</p>';
                return;
            }

            recordsContainer.innerHTML = `
                <table class="attendance-records-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Student Name</th>
                            <th>Register No</th>
                            <th>Student Email</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${records.map(r => `
                            <tr class="${r.status === 'PRESENT' ? 'row-present' : 'row-absent'}">
                                <td>${new Date(r.attendanceDate).toLocaleDateString('en-IN')}</td>
                                <td>${r.studentName}</td>
                                <td>${r.studentRegisterNumber}</td>
                                <td>${r.studentEmail || ''}</td>
                                <td><strong>${r.status}</strong></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        } catch (error) {
            recordsContainer.innerHTML = `<p style="color:red">Error loading records: ${error.message}</p>`;
        }
    }

    document.getElementById('filterAttendanceBtn').onclick = function() {
        loadAttendanceRecords();
    };

async function loadAttendanceStudents() {
  const courseSelect = document.getElementById('attendanceCourse');
  const assignment = facultyAssignments.find(course => course.courseName === courseSelect.value);
  if (!assignment) {
    students = [];
    renderAttendanceGrid(document.getElementById('attendanceDate').value);
    return;
  }

  fetch(AttendanceUrl + encodeURIComponent(assignment.section))
        .then(response => response.json())
        .then(data => {
            students = data.map(s => ({
                name: s.name,
                email: s.email,
                regNo: s.registerNo
            }));

            const selectedDate = document.getElementById('attendanceDate').value;
            renderAttendanceGrid(selectedDate);
        })
        .catch(err => console.error("Error fetching students: ", err));
    }

    async function loadAssignedAttendanceCourses() {
      const registerNumber = localStorage.getItem('registerNumber') || localStorage.getItem('profileRegNo') || '';
      const courseSelect = document.getElementById('attendanceCourse');
      if (!registerNumber || !courseSelect) return;

      try {
        const response = await fetch(`${FACULTY_COURSE_API}/by-registration/${encodeURIComponent(registerNumber)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        facultyAssignments = await response.json();
        courseSelect.innerHTML = facultyAssignments.length
          ? facultyAssignments.map(course => `<option value="${escapeHtml(course.courseName)}">${escapeHtml(course.courseName)} - ${escapeHtml(course.section)}</option>`).join('')
          : '<option value="">No courses assigned</option>';
        await loadAttendanceStudents();
      } catch (error) {
        courseSelect.innerHTML = '<option value="">Unable to load assigned courses</option>';
        console.error('Error loading assigned faculty courses:', error);
      }
    }

    document.getElementById('attendanceCourse').addEventListener('change', loadAttendanceStudents);

// Helper functions
function getAttendanceKey(dateStr) {
    const section = getSelectedAssignment()?.section || '';
    const course = document.getElementById('attendanceCourse').value.trim() || 'Course';
    return `attendance_${section}_${course}_${dateStr}`;
}

function getTodayStr() {
    return new Date().toISOString().slice(0, 10);
}

function isFuture(dateStr) {
    return dateStr > getTodayStr();
}

function loadAttendance(dateStr) {
    const key = getAttendanceKey(dateStr);
    const data = localStorage.getItem(key);

    if (data) return JSON.parse(data);

    return students.map(() => false);
}

function saveAttendance(dateStr, attendanceArr) {
    if (isFuture(dateStr)) return;
    localStorage.setItem(getAttendanceKey(dateStr), JSON.stringify(attendanceArr));
}

// ✅ RENDER GRID
function renderAttendanceGrid(dateStr) {
    const grid = document.getElementById('attendanceGrid');
    grid.innerHTML = '';

    const attendanceArr = loadAttendance(dateStr);

    students.forEach((student, idx) => {
        const present = attendanceArr[idx];

        const btn = document.createElement('button');
        btn.className = present ? 'status-present' : 'status-absent';

        btn.innerHTML = `
            <div>Name: ${student.name}</div>
            <div>Email: ${student.email}</div>
            <div>Reg No: ${student.regNo}</div>
        `;

        if (!isFuture(dateStr)) {
            btn.onclick = function () {
                attendanceArr[idx] = !attendanceArr[idx];
                saveAttendance(dateStr, attendanceArr);
                renderAttendanceGrid(dateStr);
            };
        } else {
            btn.disabled = true;
        }

        const block = document.createElement('div');
        block.className = 'student-block';
        block.appendChild(btn);

        grid.appendChild(block);
    });

    updateAttendanceSummary(attendanceArr);
}

// ✅ SUMMARY
function updateAttendanceSummary(attendanceArr) {
    const total = students.length;
    const present = attendanceArr.filter(Boolean).length;

    document.getElementById('totalStudents').textContent = total;
    document.getElementById('totalPresent').textContent = present;
    document.getElementById('totalAbsent').textContent = total - present;
}

    async function loadMyTimetable() {
      const loadingEl = document.getElementById('loading-timetable');
      const container = document.getElementById('timetableContainer');
      const noDataEl = document.getElementById('no-timetable');

          );

          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

          const timetableData = await response.json();

    async function sendInternalMail(form, files, sender) {
      const attachments = await Promise.all(files.map(file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ fileName: file.name, contentType: file.type || 'application/octet-stream', size: file.size, data: reader.result });
        reader.onerror = () => reject(new Error(`Unable to read attachment ${file.name}`));
        reader.readAsDataURL(file);
      })));
      const payload = {
        senderRole: sender.role,
        senderName: sender.name,
        senderId: sender.id,
        recipientRole: form.querySelector('[name="recipientRole"]').value,
        recipientName: form.querySelector('[name="recipientName"]').value,
        recipientId: form.querySelector('[name="recipientId"]').value,
        subject: form.querySelector('[name="subject"]').value,
        body: form.querySelector('[name="description"]').value,
        attachments
      };

      if (!payload.senderId) {
        throw new Error('Your faculty register number is missing. Please login again before sending mail.');
      }

      const response = await fetch(`${PORTAL_API}/mail/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `HTTP ${response.status}`);
      }
    }

    async function loadMailbox(role, id, containerId) {
      const container = document.getElementById(containerId);
      if (!id) {
        container.innerHTML = '<p>Please login again to view your mailbox.</p>';
        return;
      }

      try {
        const response = await fetch(`${PORTAL_API}/mail/inbox?role=${encodeURIComponent(role)}&id=${encodeURIComponent(id)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const messages = await response.json();
        container.innerHTML = messages.length ? messages.map(message => `
          <div class="draft-item">
            <strong>${escapeHtml(message.subject)}</strong>
            <p>${escapeHtml(message.body)}</p>
            <small>From ${escapeHtml(message.senderName)} (${escapeHtml(message.senderId)}) - ${new Date(message.createdAt).toLocaleString()}</small>
          </div>
        `).join('') : '<p>No application mails yet.</p>';
      } catch (error) {
        container.innerHTML = `<p style="color:red">Unable to load mailbox: ${escapeHtml(error.message)}</p>`;
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function setupFacultyEmailLogic(formId, fileInputId, attachedFilesId, setupShareLogicCallback) {
      // Get DOM elements

      let facultyHomeFiles = [];
      let facultyHomeDrafts = JSON.parse(localStorage.getItem('facultyHomeEmailDrafts')) || [];

      // Update draft count badge
      function updateDraftCountFacultyHome() {
        draftCountFaculty.textContent = facultyHomeDrafts.length;

        const subject = formFaculty.querySelector('input[name="subject"]').value.trim();
        const description = formFaculty.querySelector('textarea[name="description"]').value.trim();
        shareButtonFaculty.disabled = !(subject || description || facultyHomeFiles.length > 0);
      }

      // Convert file to base64
      async function convertToBase64FacultyHome(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('Failed to read file'));
          reader.readAsDataURL(file);
        });
      }

      // Convert base64 to File
      function base64ToFileFacultyHome(base64, filename, mimeType) {
        const byteString = atob(base64.split(',')[1]);
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
          ia[i] = byteString.charCodeAt(i);
        }
        return new File([ab], filename, { type: mimeType });
      }

      // Save draft
      async function saveDraftFacultyHome() {
        const subject = formFaculty.querySelector('input[name="subject"]').value.trim();
        const description = formFaculty.querySelector('textarea[name="description"]').value.trim();
        if ((subject || description || facultyHomeFiles.length > 0) && !isSendingFacultyHome) {
          const fileData = await Promise.all(
            facultyHomeFiles.map(async file => ({
              name: file.name,
              type: file.type,
              size: file.size,
              data: await convertToBase64FacultyHome(file)
            }))
          );
          const draft = {
            id: Date.now(),
            subject,
            description,
            files: fileData,
            timestamp: new Date().toISOString()
          };
          facultyHomeDrafts = facultyHomeDrafts.filter(d => d.subject !== subject || d.description !== description);
          facultyHomeDrafts.push(draft);
          localStorage.setItem('facultyHomeEmailDrafts', JSON.stringify(facultyHomeDrafts));
          updateDraftCountFacultyHome();
        }
      }

      // Display drafts

        draftListFaculty.innerHTML = '';

          const draftElement = document.createElement('div');

          const fileNames = draft.files.map(file => file.name).join(', ');
          const descriptionPreview = draft.description ? draft.description.split('\n')[0].substring(0, 50) + (draft.description.length > 50 ? '...' : '') : 'No Content';

              <button class="delete-draft" data-index="${index}">Delete</button>
            </div>

          draftListFaculty.appendChild(draftElement);
        });

        // Event listeners for draft actions
        draftListFaculty.addEventListener('click', async (e) => {
          const loadButton = e.target.closest('.load-draft');

            formFaculty.querySelector('input[name="subject"]').value = draft.subject || '';
            formFaculty.querySelector('textarea[name="description"]').value = draft.description || '';
            facultyHomeFiles = await Promise.all(
              draft.files.map(file => base64ToFileFacultyHome(file.data, file.name, file.type))
            );
            updateAttachedFilesDisplayFacultyHome();
            updateShareButtonStateFacultyHome();
            draftModalFaculty.style.display = 'none';
          }
          if (deleteButton) {
            const index = parseInt(deleteButton.dataset.index, 10);
            facultyHomeDrafts.splice(index, 1);
            localStorage.setItem('facultyHomeEmailDrafts', JSON.stringify(facultyHomeDrafts));
            updateDraftCountFacultyHome();
            displayDraftsFacultyHome();
          }
        });
      }

      // Handle file selection
      fileInputFaculty.addEventListener('change', (event) => {
        const files = Array.from(event.target.files);

      // Update attached files display

        attachedFilesDivFaculty.innerHTML = '';

            fileTypeClass = 'generic';

          fileElement.innerHTML = `
            <div class="file-preview ${fileTypeClass}">
              <img src="${previewUrl}" alt="File preview" class="attached-img">
              <div class="file-overlay">
                <button type="button" class="view-file" data-index="${index}" data-is-image="${isImage}">

                  <i class="fas fa-times"></i>
                </button>
              </div>
              <span class="file-name">${fileName}</span>
            </div>
          `;
          attachedFilesDivFaculty.appendChild(fileElement);
        });

        // Event delegation for view and remove buttons
        attachedFilesDivFaculty.addEventListener('click', (e) => {
          const viewButton = e.target.closest('.view-file');
          const removeButton = e.target.closest('.remove-file');

          if (viewButton) {
            const index = parseInt(viewButton.dataset.index, 10);
            const isImage = viewButton.dataset.isImage === 'true';
            const file = facultyHomeFiles[index];

            if (isImage) {
              modalImageFaculty.src = URL.createObjectURL(file);
              modalFaculty.style.display = 'flex';
            } else {
              const url = URL.createObjectURL(file);
              window.open(url, '_blank');
              setTimeout(() => URL.revokeObjectURL(url), 0);
            }
          }

          if (removeButton) {
            const index = parseInt(removeButton.dataset.index, 10);
            if (facultyHomePreviewUrls.has(index)) {
              URL.revokeObjectURL(facultyHomePreviewUrls.get(index));
              facultyHomePreviewUrls.delete(index);
            }
            facultyHomeFiles.splice(index, 1);
            updateAttachedFilesDisplayFacultyHome();
            updateShareButtonStateFacultyHome();
          }
        });
      }

      // Save draft on page unload
      window.addEventListener('beforeunload', async () => {
        if (!isSendingFacultyHome) {
          await saveDraftFacultyHome();
        }
      });

      // Open draft modal
      draftButtonFaculty.addEventListener('click', () => {
        displayDraftsFacultyHome();
        draftModalFaculty.style.display = 'flex';
      });

      // Close draft modal
      draftModalCloseFaculty.addEventListener('click', () => {
        draftModalFaculty.style.display = 'none';
      });

      draftModalFaculty.addEventListener('click', (e) => {
        if (e.target === draftModalFaculty) {
          draftModalFaculty.style.display = 'none';
        }
      });

      // Close image modal
      modalCloseFaculty.addEventListener('click', () => {
        modalFaculty.style.display = 'none';
        URL.revokeObjectURL(modalImageFaculty.src);
      });

      modalFaculty.addEventListener('click', (e) => {
        if (e.target === modalFaculty) {
          modalFaculty.style.display = 'none';
          URL.revokeObjectURL(modalImageFaculty.src);
        }
      });

      // Handle form submission
      formFaculty.addEventListener('submit', async (event) => {
        event.preventDefault();
        isSendingFacultyHome = true;
        try {
          await sendInternalMail(formFaculty, facultyHomeFiles, getCurrentFacultyIdentity());
          facultyHomeDrafts = facultyHomeDrafts.filter(d => d.subject !== formFaculty.querySelector('input[name="subject"]').value ||
                                                  d.description !== formFaculty.querySelector('textarea[name="description"]').value);
          localStorage.setItem('facultyHomeEmailDrafts', JSON.stringify(facultyHomeDrafts));
          updateDraftCountFacultyHome();
          formFaculty.reset();
          facultyHomeFiles = [];
          updateAttachedFilesDisplayFacultyHome();
          updateShareButtonStateFacultyHome();
          alert('Mail sent inside the application.');
        } catch (error) {
          alert(`Mail failed: ${error.message}`);
        } finally {
          isSendingFacultyHome = false;
        }
      });

      formFaculty.querySelector('.inbox-btn').addEventListener('click', () => {
        const faculty = getCurrentFacultyIdentity();
        loadMailbox(faculty.role, faculty.id, 'faculty-mailbox');
      });

      // Clear attached files on form reset
      formFaculty.addEventListener('reset', () => {
        facultyHomeFiles = [];
        facultyHomePreviewUrls.forEach(url => URL.revokeObjectURL(url));
        facultyHomePreviewUrls.clear();
        updateAttachedFilesDisplayFacultyHome();
        updateShareButtonStateFacultyHome();
      });

      // Initialize share button
      updateShareButtonStateFacultyHome();

      // Set up share logic
      setupShareLogicCallback(facultyHomeFiles);
    }

    // Share logic for Faculty Email
    function setupShareLogicFaculty(facultyFiles) {
      // Page-specific variables for facultyHome
      const facultyForm = document.getElementById('facultyEmailForm');
      const facultyShareButton = facultyForm.querySelector('.share-btn');
      const facultyShareModal = document.getElementById('share-modal-faculty');
      const facultyCloseModal = document.getElementById('share-modal-close-faculty');
      const facultyShareConfirm = document.getElementById('share-confirm-faculty');
      const facultyShareOptions = document.querySelectorAll('#share-modal-faculty .share-option');
      let facultySelectedPlatform = null;

      // Convert file to base64 (page-specific function)
      async function convertToBase64Faculty(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('Failed to read file'));
          reader.readAsDataURL(file);
        });
      }

      // Open share modal
      facultyShareButton.addEventListener('click', () => {
        const subject = facultyForm.querySelector('input[name="subject"]').value.trim();
        const description = facultyForm.querySelector('textarea[name="description"]').value.trim();
        if (!subject && !description && facultyFiles.length === 0) {
          alert('Please add a subject, description, or file to share.');
          return;
        }
        if (!facultyShareButton.disabled) {
          facultyShareModal.style.display = 'flex';
        }
      });

      // Close share modal
      facultyCloseModal.addEventListener('click', () => {
        facultyShareModal.style.display = 'none';
        facultySelectedPlatform = null;
        facultyShareOptions.forEach(option => option.classList.remove('selected'));
      });

      facultyShareModal.addEventListener('click', (e) => {
        if (e.target === facultyShareModal) {
          facultyShareModal.style.display = 'none';
          facultySelectedPlatform = null;
          facultyShareOptions.forEach(option => option.classList.remove('selected'));
        }
      });

      // Select platform
      facultyShareOptions.forEach(option => {
        option.addEventListener('click', () => {
          facultyShareOptions.forEach(opt => opt.classList.remove('selected'));
          option.classList.add('selected');
          facultySelectedPlatform = option.getAttribute('data-platform');
        });
      });

      // Handle share confirmation
      facultyShareConfirm.addEventListener('click', async () => {
        if (!facultySelectedPlatform) {
          alert('Please select a platform to share.');
          return;
        }

        const facultySubject = facultyForm.querySelector('input[name="subject"]').value || 'No Subject';
        const facultyDescription = facultyForm.querySelector('textarea[name="description"]').value || 'No Description';
        let facultyShareText = `${facultySubject}\n\n${facultyDescription}`;

        let facultyFileLinks = '';
        let facultyFilesToShare = [];
        if (facultyFiles.length > 0) {
          facultyFileLinks = '\n\nAttached Files:\n';
          facultyFilesToShare = await Promise.all(
            facultyFiles.map(async file => {
              try {
                if (file.size > 5 * 1024 * 1024) { // 5MB limit for sharing
                  facultyFileLinks += `${file.name}: [File too large to share]\n`;
                  return null;
                }
                const fileDataUrl = await convertToBase64Faculty(file);
                facultyFileLinks += `${file.name}: [Attachment]\n`;
                return { file, dataUrl: fileDataUrl };
              } catch (error) {
                console.error('Error converting file to data URL:', error);
                facultyFileLinks += `${file.name}: [Error processing file]\n`;
                return null;
              }
            })
          );
          facultyFilesToShare = facultyFilesToShare.filter(file => file !== null);
        }

        facultyShareText += facultyFileLinks;

        switch (facultySelectedPlatform) {
          case 'whatsapp':
            if (facultyShareText.length > 2000) {
              alert('Content exceeds WhatsApp character limit (2000). Please shorten the message.');
              return;
            }
            if ('share' in navigator && facultyFilesToShare.length > 0) {
              const shareData = {
                title: facultySubject,
                text: facultyDescription,
                files: facultyFilesToShare.map(item => item.file)
              };
              try {
                await navigator.share(shareData);
              } catch (error) {
                console.error('Error sharing via Web Share API:', error);
                alert('Failed to share via WhatsApp. Please try again.');
              }
            } else {
              const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(facultyShareText)}`;
              window.open(whatsappUrl, '_blank');
            }
            break;

          case 'x':
            if (facultyShareText.length > 280) {
              alert('Content exceeds X character limit (280). Please shorten the message.');
              return;
            }
            const xUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(facultyShareText)}`;
            window.open(xUrl, '_blank');
            break;

          case 'gmail':
            const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&su=${encodeURIComponent(facultySubject)}&body=${encodeURIComponent(facultyShareText)}`;
            window.open(gmailUrl, '_blank');
            break;

          case 'outlook':
            const outlookUrl = `https://outlook.live.com/mail/0/deeplink/compose?subject=${encodeURIComponent(facultySubject)}&body=${encodeURIComponent(facultyShareText)}`;
            window.open(outlookUrl, '_blank');
            break;

          default:
            alert('Invalid platform selected.');
            return;
        }

        facultyShareModal.style.display = 'none';
        facultySelectedPlatform = null;
        facultyShareOptions.forEach(option => option.classList.remove('selected'));
      });
    }


    //Home
    async function loadMyCourses() {
    const loadingEl = document.getElementById('loading');
    const gridEl = document.getElementById('course-grid');
    const noCoursesEl = document.getElementById('no-courses');

    // Safety checks
    if (!loadingEl || !gridEl || !noCoursesEl) {
        console.error("Required elements not found in DOM. Check your HTML IDs.");
        return;
    }

    const registerNumber = localStorage.getItem('registerNumber') || localStorage.getItem('profileRegNo');
    if (!registerNumber) {
        loadingEl.style.display = 'none';
        noCoursesEl.style.display = 'block';
        return;
    }

    try {
        loadingEl.style.display = 'block';
        gridEl.style.display = 'none';
        noCoursesEl.style.display = 'none';

        const response = await fetch(`${FACULTY_COURSE_API}/by-registration/${encodeURIComponent(registerNumber)}`);

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const courses = await response.json();

        loadingEl.style.display = 'none';

        if (!courses || courses.length === 0) {
            noCoursesEl.style.display = 'block';
            gridEl.style.display = 'none';
            return;
        }

        // Show courses
        gridEl.style.display = 'grid';
        noCoursesEl.style.display = 'none';

        let html = '';
        courses.forEach(course => {
            html += `
                <div class="course-card">
                    <h4>${course.courseName || 'N/A'}</h4>
                    <p><strong>Section:</strong> ${course.section || 'N/A'}</p>
                    <p><strong>Reg No:</strong> ${course.registrationNumber || 'N/A'}</p>
                </div>
            `;
        });

        gridEl.innerHTML = html;

    } catch (error) {
        console.error("Error loading courses:", error);
        loadingEl.style.display = 'none';
        noCoursesEl.style.display = 'block';
        noCoursesEl.innerHTML = `<p style="color:red">Failed to load courses: ${error.message}</p>`;
    }
}
  
  </script>
