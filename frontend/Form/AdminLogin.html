<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Flow Portal | Admin Login</title>
    <link rel="stylesheet" href="AdminLogin.css">
    <link rel="stylesheet" href="../portal-responsive.css">
</head>
<body>
    <div class="container">
        <div class="image-container">
            <img src="../Images/portal-auth.svg" alt="Abstract learning workspace">
        </div>
        <div class="login-container">
            <h1>Campus Flow</h1>
            <p>Admin Login</p>
            <div id="formMessage" class="form-message" role="status" aria-live="polite"></div>

            <form id="loginForm" method="post">
                <div class="input-field">
                    <label for="adminid">Admin Name</label>
                    <input type="text" id="adminid" name="adminid" placeholder="Enter Id" required>
                </div>
                <div class="input-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password" required>
                </div>
                <button type="submit" id="loginBtn">LogIn</button>
                <div id="adminGoogleButton" class="google-auth-button"></div>
            </form>
            <a class="forgotPass" href="#" onclick="forgotPassword(); return false;">Forgot Password?</a>
            <p><a class="createAcc" href="AdminRegistration.html">Click here to create new account?</a></p>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="googleAuth.js"></script>
    <script>
        const validations = {
            adminid: {
                regex: /^[a-zA-Z][a-zA-Z0-9\s!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]*$/,
                errorMsg: 'Admin name must start with an alphabet letter.'
            },
            password: {
                regex: /^.{6,20}$/,
                errorMsg: 'Password must be 6-20 characters.'
            }
        };

        Object.keys(validations).forEach(fieldId => {
            const input = document.getElementById(fieldId);
            const span = document.createElement('span');
            span.className = 'validation-message';
            span.id = `${fieldId}-validation`;
            input.parentNode.appendChild(span);

            const validate = () => {
                const config = validations[fieldId];
                if (config.regex.test(input.value.trim())) {
                    span.textContent = 'Looks good!';
                    span.className = 'validation-message success';
                    input.classList.remove('invalid-field');
                    input.classList.add('valid-field');
                    return true;
                }

                span.textContent = config.errorMsg;
                span.className = 'validation-message error';
                input.classList.remove('valid-field');
                input.classList.add('invalid-field');
                return false;
            };

            input.addEventListener('input', () => {
                clearFormMessage();
                validate();
            });
            input.addEventListener('blur', validate);
        });

        document.getElementById('loginForm').addEventListener('submit', async event => {
            event.preventDefault();
            clearFormMessage();

            const isFormValid = Object.keys(validations).every(fieldId =>
                validations[fieldId].regex.test(document.getElementById(fieldId).value.trim()));

            if (!isFormValid) {
                showFormMessage('Please correct the highlighted fields.', 'error');
                return;
            }

            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const response = await fetch('http://localhost:9093/Admin/Admin_Register/AdminLogin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('adminid').value.trim(),
                        password: document.getElementById('password').value.trim()
                    })
                });
                const resultText = await response.text();

                if (!response.ok) {
                    showFormMessage(resultText || 'Invalid admin name or password.', 'error');
                    return;
                }

                localStorage.setItem('authToken', resultText);
                localStorage.setItem('adminName', document.getElementById('adminid').value.trim());
                showFormMessage('Login successful. Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = '../AdminHomePage.html';
                }, 900);
            } catch (error) {
                console.error('Admin login error:', error);
                showFormMessage('Something went wrong. Please make sure the admin service is running.', 'error');
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'LogIn';
            }
        });

        function forgotPassword() {
            showFormMessage('Please contact administrator to reset your password.', 'info');
        }

        setupGoogleAuth({
            buttonId: 'adminGoogleButton',
            role: 'ADMIN',
            redirectUrl: '../AdminHomePage.html'
        });
    </script>
</body>
</html>
