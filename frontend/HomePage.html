    async function refreshStudentProfile() {
      const registerNo = localStorage.getItem('studentRegisterNumber') || localStorage.getItem('registerNumber');
      if (!registerNo) return;

      try {
        const response = await fetch(`${PROFILE_API}/by-reg/${encodeURIComponent(registerNo)}`);
        if (!response.ok) return;
        const student = await response.json();
        localStorage.setItem('profileName', student.name || '');
        localStorage.setItem('profileEmail', student.email || '');
        localStorage.setItem('profilePhone', student.phone || '');
        localStorage.setItem('profileRegNo', student.registerNo || registerNo);
        localStorage.setItem('studentRegisterNumber', student.registerNo || registerNo);
        updateHeaderProfile();

        const fields = {
          profileName: student.name || 'N/A',
          profileEmail: student.email || 'N/A',
          profilePhone: student.phone || 'N/A',
          profileRegNo: student.registerNo || registerNo,
          profileSection: student.section || 'N/A'
        };
        Object.entries(fields).forEach(([id, value]) => {
          const element = document.getElementById(id);
          if (element) element.textContent = value;
        });
      } catch (error) {
        console.error('Student profile refresh failed:', error);
      }
    }

    function processPayment() {
      const amountInput = document.getElementById('amount');
      const amount = parseFloat(amountInput.value);
      const totalBalance = parseFloat(document.getElementById('totalBalance').textContent);
      const program = document.getElementById('sectionSelect').value;

      // Validate amount
      if (isNaN(amount) || amount <= 0) {
        const modalOverlay = document.createElement('div');
        modalOverlay.className = 'modal-overlay';
        modalOverlay.innerHTML = `
          <div class="modal">
            <h3>Invalid Amount</h3>
            <p>Please enter a valid positive amount.</p>
            <div class="modal-buttons">
              <button class="confirm-btn" id="closeModal">OK</button>
            </div>
          </div>
        `;
        document.body.appendChild(modalOverlay);
        document.getElementById('closeModal').addEventListener('click', () => {
          modalOverlay.remove();
        });
        return;
      }

      if (amount > totalBalance) {
        const modalOverlay = document.createElement('div');
        modalOverlay.className = 'modal-overlay';
        modalOverlay.innerHTML = `
          <div class="modal">
            <h3>Amount Exceeds Balance</h3>
            <p>The amount entered (₹${amount.toFixed(2)}) exceeds the total balance (₹${totalBalance.toFixed(2)}).</p>
            <div class="modal-buttons">
              <button class="confirm-btn" id="closeModal">OK</button>
            </div>
          </div>
        `;
        document.body.appendChild(modalOverlay);
        document.getElementById('closeModal').addEventListener('click', () => {
          modalOverlay.remove();
        });
        return;
      }

      // Distribute payment across rows
      let remainingAmount = amount;
      const rows = document.querySelectorAll('#feeTable tbody tr:not(.total-row)');
      rows.forEach(row => {
        if (remainingAmount <= 0) return;
        const cells = row.querySelectorAll('td.editable');
        const balance = parseFloat(cells[3].textContent) || 0;
        if (balance > 0) {
          const payment = Math.min(remainingAmount, balance);
          const currentPaid = parseFloat(cells[2].textContent) || 0;
          cells[2].textContent = (currentPaid + payment).toFixed(2);
          cells[3].textContent = (balance - payment).toFixed(2);
          remainingAmount -= payment;
        }
      });

      // Record payment in history
      const timestamp = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', dateStyle: 'medium', timeStyle: 'short' });
      paymentHistory.push({ program, amount: amount.toFixed(2), timestamp });
      renderPaymentHistory();

      // Clear input
      amountInput.value = '';
      updateTotals();
    }

    function downloadReceipt() {
      if (paymentHistory.length === 0) {
        const modalOverlay = document.createElement('div');
        modalOverlay.className = 'modal-overlay';
        modalOverlay.innerHTML = `
          <div class="modal">
            <h3>No Payments</h3>

        `;
        document.body.appendChild(modalOverlay);

        });
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text('Fee Payment Receipt', 20, 20);
      doc.setFontSize(12);
      doc.text('Payment History:', 20, 30);

      const headers = ["SL.NO", "Program", "Amount", "Date and Time"];
      const rows = paymentHistory.map((p, i) => [
        `${i + 1}`,
        p.program,
        `${p.amount}`,
        p.timestamp.replace(',', ' at')
      ]);

      doc.autoTable({
        head: [headers],
        body: rows,
        startY: 40,
      });

      doc.text(`Issued on: ${new Date().toLocaleString('en-IN')}`, 20, doc.lastAutoTable.finalY + 10);
      doc.save("receipt.pdf");
    }

    let attendanceBarChart = null;
    let attendanceDonutChart = null;

    async function loadStudentAttendanceSummary() {
      const container = document.getElementById('studentAttendanceSummary');
      const chartsWrapper = document.getElementById('attendanceCharts');
      const recordsSection = document.getElementById('attendanceRecordsSection');
      const registerNumber = getCurrentStudentIdentity().id;

      if (!registerNumber) {
        container.innerHTML = '<p>Please update your profile with a registration number to view attendance.</p>';
        return;
      }

      try {
        const response = await fetch(`${PORTAL_API}/attendance/student/${encodeURIComponent(registerNumber)}/summary`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const summaries = await response.json();
        if (!summaries.length) {
          container.innerHTML = '<p>No attendance has been submitted for your subjects yet.</p>';
          return;
        }

        container.style.display = 'none';
        chartsWrapper.style.display = 'block';

        const labels = summaries.map(s => s.courseName);
        const percentages = summaries.map(s => s.percentage);
        const presentData = summaries.map(s => s.presentClasses);
        const absentData = summaries.map(s => s.absentClasses);

        const overallPresent = presentData.reduce((a, b) => a + b, 0);
        const overallAbsent = absentData.reduce((a, b) => a + b, 0);
        const total = overallPresent + overallAbsent;

        if (attendanceBarChart) attendanceBarChart.destroy();
        const barCtx = document.getElementById('attendanceBarChart').getContext('2d');
        attendanceBarChart = new Chart(barCtx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [{
              label: 'Attendance %',
              data: percentages,
              backgroundColor: percentages.map(p => p >= 75 ? '#198754' : p >= 50 ? '#fd7e14' : '#dc3545'),
              borderRadius: 6,
              barPercentage: 0.7
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            indexAxis: 'y',
            scales: {
              x: {
                beginAtZero: true,
                max: 100,
                ticks: { font: { size: 10 } },
                grid: { display: true }
              },
              y: {
                ticks: { font: { size: 10 } }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => `Present: ${summaries[ctx.dataIndex].presentClasses}/${summaries[ctx.dataIndex].totalClasses} (${ctx.raw}%)`
                }
              }
            }
          }
        });

        if (attendanceDonutChart) attendanceDonutChart.destroy();
        const donutCtx = document.getElementById('attendanceDonutChart').getContext('2d');
        attendanceDonutChart = new Chart(donutCtx, {
          type: 'doughnut',
          data: {
            labels: ['Present', 'Absent'],
            datasets: [{
              data: [overallPresent, overallAbsent],
              backgroundColor: ['#198754', '#dc3545'],
              borderColor: '#fff',
              borderWidth: 4
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '60%',
            plugins: {
              legend: { position: 'bottom' },
              tooltip: {
                callbacks: {
                  label: (ctx) => `${ctx.label}: ${ctx.raw} (${total > 0 ? Math.round(ctx.raw / total * 100) : 0}%)`
                }
              }
            }
          }
        });

        recordsSection.style.display = 'block';
        const recordsContainer = document.getElementById('attendanceRecords');
        recordsContainer.innerHTML = summaries.map(subject => `
          <div class="subject-record">
            <h4>${escapeHtml(subject.courseName)}</h4>
            <p>Total: ${subject.totalClasses} | Present: ${subject.presentClasses} | Absent: ${subject.absentClasses} | <strong>${subject.percentage}%</strong></p>
          </div>
        `).join('');

      } catch (error) {
        container.innerHTML = `<p style="color:red">Unable to load attendance: ${escapeHtml(error.message)}</p>`;
        chartsWrapper.style.display = 'none';
        recordsSection.style.display = 'none';
      }
    }

    function getCurrentStudentIdentity() {
      return {
        role: 'STUDENT',
        name: localStorage.getItem('profileName') || localStorage.getItem('studentName') || 'Student',
        id: localStorage.getItem('profileRegNo') || localStorage.getItem('registerNumber') || localStorage.getItem('studentRegisterNumber') || ''
      };
    }

    async function loadMyCourses() {
      const loadingEl = document.getElementById('loading-courses');
      const gridEl = document.getElementById('course-grid');
      const noCoursesEl = document.getElementById('no-courses');

      const registerNumber = getCurrentStudentIdentity().id;

      if (!registerNumber) {
        loadingEl.style.display = 'none';
        noCoursesEl.style.display = 'block';
        return;
      }

      try {
        const response = await fetch(`${STUDENTS_API}/by-reg/${encodeURIComponent(registerNumber)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const student = await response.json();
        const section = student.section || '';

        if (!section) {
          loadingEl.style.display = 'none';
          noCoursesEl.style.display = 'block';
          return;
        }

        const courseRes = await fetch(`${COURSES_API}/by-section/${encodeURIComponent(section)}`);
        if (!courseRes.ok) throw new Error(`HTTP ${courseRes.status}`);

        const courses = await courseRes.json();
        loadingEl.style.display = 'none';

        if (!courses || courses.length === 0) {
          noCoursesEl.style.display = 'block';
          return;
        }

        gridEl.style.display = 'grid';
        gridEl.innerHTML = courses.map(course => `
          <div class="course-card">
            <h3>${escapeHtml(course.courseCode || course.courseName || 'N/A')}</h3>
            <p>${escapeHtml(course.courseName || 'N/A')}</p>
            <span>${escapeHtml(course.facultyName || 'N/A')}</span>
          </div>
        `).join('');
      } catch (error) {
        console.error('Error loading courses:', error);
        loadingEl.style.display = 'none';
        noCoursesEl.style.display = 'block';
        noCoursesEl.innerHTML = '<p>Unable to load courses. Please ensure you have completed your profile.</p>';
      }
    }

    async function loadStudentTimetable() {
      const registerNumber = getCurrentStudentIdentity().id;
      const timetableEl = document.getElementById('timetableContainer');

      if (!registerNumber) {
        timetableEl.innerHTML = '<p style="color:red">Please update your profile with a registration number.</p>';
        return;
      }

      const studentRes = await fetch(`${STUDENTS_API}/by-reg/${encodeURIComponent(registerNumber)}`);
      if (!studentRes.ok) {
        timetableEl.innerHTML = '<p style="color:red">Unable to load timetable.</p>';
        return;
      }

      const student = await studentRes.json();
      const programName = student.section || '';

      if (!programName) {
        timetableEl.innerHTML = '<p>No program assigned to your profile.</p>';
        return;
      }

      const response = await fetch(`${TIMETABLE_API}/by-program/${encodeURIComponent(programName)}`);
      if (!response.ok) {
        timetableEl.innerHTML = '<p style="color:red">Unable to load timetable.</p>';
        return;
      }

      const timetableData = await response.json();
      if (!timetableData || timetableData.length === 0) {
        timetableEl.innerHTML = '<p>No timetable assigned yet.</p>';
        return;
      }

      const daysOrder = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
      const programMap = {};
      timetableData.forEach(item => {
        const prog = item.programName || "Unknown Program";
        if (!programMap[prog]) programMap[prog] = {};
        programMap[prog][item.day] = item;
      });

      let html = '';
      Object.keys(programMap).forEach(programName => {
        const daysMap = programMap[programName];
        html += `<div class="program-section"><h3>${escapeHtml(programName)}</h3><table class="table"><thead><tr>
          <th>Day</th><th>Slot 1</th><th>Slot 2</th><th>Slot 3</th><th>Slot 4</th>
          <th>Slot 5</th><th>Slot 6</th><th>Slot 7</th><th>Slot 8</th><th>Slot 9</th><th>Slot 10</th>
        </tr></thead><tbody>`;
        daysOrder.forEach(day => {
          const data = daysMap[day] || {};
          html += `<tr><td><strong>${day}</strong></td>`;
          for (let i = 1; i <= 10; i++) {
            html += `<td>${escapeHtml(data['slot' + i] || '')}</td>`;
          }
          html += `</tr>`;
        });
        html += `</tbody></table></div>`;
      });

      timetableEl.innerHTML = html;
    }

    async function loadStudentFees() {
      const loadingEl = document.getElementById('loading-fees');
      const feeTable = document.getElementById('feeTable');
      const feeTableBody = document.getElementById('feeTableBody');
      const paymentForm = document.getElementById('paymentForm');
      const program = document.getElementById('sectionSelect').value;

      if (!program) {
        loadingEl.innerHTML = '<p style="color:red">Please select a program to view fees.</p>';
        return;
      }

      try {
        const response = await fetch(`${FEE_API}/by-program/${encodeURIComponent(program)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const fees = await response.json();
        loadingEl.style.display = 'none';
        feeTable.style.display = 'table';
        paymentForm.style.display = 'block';

        if (!fees || fees.length === 0) {
          feeTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;">No fee records found.</td></tr>';
          document.getElementById('totalFees').textContent = '0';
          document.getElementById('totalPaid').textContent = '0';
          document.getElementById('totalBalance').textContent = '0';
          return;
        }

        let totalFees = 0;
        let totalPaid = 0;

          feeTableBody.innerHTML = fees.map((fee, index) => {
          const feeAmount = fee.fees || 0;
          const paidAmount = fee.paid || 0;
          const balance = feeAmount - paidAmount;
          totalFees += feeAmount;
          totalPaid += paidAmount;
          return `
            <tr>
              <td>${index + 1}</td>
              <td class="editable">${escapeHtml(fee.categoryName || 'N/A')}</td>
              <td class="editable">${feeAmount}</td>
              <td class="editable">${paidAmount}</td>
              <td class="editable">${balance}</td>
            </tr>
          `;
        }).join('');

        document.getElementById('totalFees').textContent = totalFees;
        document.getElementById('totalPaid').textContent = totalPaid;
        document.getElementById('totalBalance').textContent = totalFees - totalPaid;
      } catch (error) {
        loadingEl.innerHTML = `<p style="color:red">Unable to load fees: ${escapeHtml(error.message)}</p>`;
        feeTable.style.display = 'none';
        paymentForm.style.display = 'none';
      }
    }

    async function sendInternalMail(form, files, sender) {
      const attachments = await Promise.all(files.map(file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ fileName: file.name, contentType: file.type || 'application/octet-stream', size: file.size, data: reader.result });
        reader.onerror = () => reject(new Error(`Unable to read attachment ${file.name}`));
        reader.readAsDataURL(file);
      })));
      const payload = {
        senderRole: sender.role,
        senderName: sender.name,
        senderId: sender.id,
        recipientRole: form.querySelector('[name="recipientRole"]').value,
        recipientName: form.querySelector('[name="recipientName"]').value,
        recipientId: form.querySelector('[name="recipientId"]').value,
        subject: form.querySelector('[name="subject"]').value,
        body: form.querySelector('[name="description"]').value,
        attachments
      };

      if (!payload.senderId) {
        throw new Error('Your profile/register number is missing. Please complete your profile before sending mail.');
      }

      const response = await fetch(`${PORTAL_API}/mail/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const text = await response.text();
        throw new Error(text || `HTTP ${response.status}`);
      }
    }

    async function loadMailbox(role, id, containerId) {
      const container = document.getElementById(containerId);
      if (!id) {
        container.innerHTML = '<p>Please complete your profile ID to view your mailbox.</p>';
        return;
      }

      try {
        const response = await fetch(`${PORTAL_API}/mail/inbox?role=${encodeURIComponent(role)}&id=${encodeURIComponent(id)}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const messages = await response.json();
        container.innerHTML = messages.length ? messages.map(message => `
          <div class="draft-item">
            <strong>${escapeHtml(message.subject)}</strong>
            <p>${escapeHtml(message.body)}</p>
            <small>From ${escapeHtml(message.senderName)} (${escapeHtml(message.senderId)}) - ${new Date(message.createdAt).toLocaleString()}</small>
          </div>
        `).join('') : '<p>No application mails yet.</p>';
      } catch (error) {
        container.innerHTML = `<p style="color:red">Unable to load mailbox: ${escapeHtml(error.message)}</p>`;
      }
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    // Logic for Student Email
function setupStudentMail(formId, fileInputId, attachedFilesId, setupShareLogicCallback) {
  // Get DOM elements
  const fileInputStudent = document.getElementById(fileInputId);
  const attachedFilesDivStudent = document.getElementById(attachedFilesId);
  const formStudent = document.getElementById(formId);
  const modalStudent = document.getElementById('image-modal-student');
  const modalImageStudent = document.getElementById('modal-image-student');
  const modalCloseStudent = document.querySelector('#image-modal-student .modal-close');
  const shareButtonStudent = formStudent.querySelector('.share-btn');
  const draftButtonStudent = formStudent.querySelector('.draft-btn');
  const draftCountStudent = document.getElementById('draft-count-student');
  const draftModalStudent = document.getElementById('draft-modal-student');
  const draftModalCloseStudent = document.getElementById('draft-modal-close-student');
  const draftListStudent = document.getElementById('draft-list-student');
  let studentHomeFiles = [];
  let studentHomeDrafts = JSON.parse(localStorage.getItem('studentHomeEmailDrafts')) || [];
  let isSendingStudentHome = false;
  const studentHomePreviewUrls = new Map();

  // Update draft count badge
  function updateDraftCountStudentHome() {
    draftCountStudent.textContent = studentHomeDrafts.length;
    draftCountStudent.style.display = studentHomeDrafts.length > 0 ? 'inline-block' : 'none';
  }

  // Initialize draft count
  updateDraftCountStudentHome();

  // Update share button state
  function updateShareButtonStateStudentHome() {
    const subject = formStudent.querySelector('input[name="subject"]').value.trim();
    const description = formStudent.querySelector('textarea[name="description"]').value.trim();
    shareButtonStudent.disabled = !(subject || description || studentHomeFiles.length > 0);
  }

  // Convert file to base64
  async function convertToBase64StudentHome(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('Failed to read file'));
      reader.readAsDataURL(file);
    });
  }

  // Convert base64 to File
  function base64ToFileStudentHome(base64, filename, mimeType) {
    const byteString = atob(base64.split(',')[1]);
    const ab = new ArrayBuffer(byteString.length);
    const ia = new Uint8Array(ab);
    for (let i = 0; i < byteString.length; i++) {
      ia[i] = byteString.charCodeAt(i);
    }
    return new File([ab], filename, { type: mimeType });
  }

  // Save draft
  async function saveDraftStudentHome() {
    const subject = formStudent.querySelector('input[name="subject"]').value.trim();
    const description = formStudent.querySelector('textarea[name="description"]').value.trim();
    if ((subject || description || studentHomeFiles.length > 0) && !isSendingStudentHome) {
      const fileData = await Promise.all(
        studentHomeFiles.map(async file => ({
          name: file.name,
          type: file.type,
          size: file.size,
          data: await convertToBase64StudentHome(file)
        }))
      );
      const draft = {
        id: Date.now(),
        subject,
        description,
        files: fileData,
        timestamp: new Date().toISOString()
      };
      studentHomeDrafts = studentHomeDrafts.filter(d => d.subject !== subject || d.description !== description);
      studentHomeDrafts.push(draft);
      localStorage.setItem('studentHomeEmailDrafts', JSON.stringify(studentHomeDrafts));
      updateDraftCountStudentHome();
    }
  }

  // Display drafts
  function displayDraftsStudentHome() {
    draftListStudent.innerHTML = '';
    studentHomeDrafts.forEach((draft, index) => {
      const draftElement = document.createElement('div');
      draftElement.classList.add('draft-item');
      const fileNames = draft.files.map(file => file.name).join(', ');
      const descriptionPreview = draft.description ? draft.description.split('\n')[0].substring(0, 50) + (draft.description.length > 50 ? '...' : '') : 'No Content';
      draftElement.innerHTML = `
        <div class="draft-content">
          <strong>${draft.subject || 'No Subject'}</strong>
          <p>${descriptionPreview}</p>
          ${draft.files.length > 0 ? `<small>Files: ${fileNames}</small>` : ''}
          <small>${new Date(draft.timestamp).toLocaleString()}</small>
        </div>
        <div class="draft-actions">
          <button class="load-draft" data-index="${index}">re-write</button>
          <button class="delete-draft" data-index="${index}">Delete</button>
        </div>
      `;
      draftListStudent.appendChild(draftElement);
    });

    // Event listeners for draft actions
    draftListStudent.addEventListener('click', async (e) => {
      const loadButton = e.target.closest('.load-draft');
      const deleteButton = e.target.closest('.delete-draft');
      if (loadButton) {
        const index = parseInt(loadButton.dataset.index, 10);
        const draft = studentHomeDrafts[index];
        formStudent.querySelector('input[name="subject"]').value = draft.subject || '';
        formStudent.querySelector('textarea[name="description"]').value = draft.description || '';
        studentHomeFiles = await Promise.all(
          draft.files.map(file => base64ToFileStudentHome(file.data, file.name, file.type))
        );
        updateAttachedFilesDisplayStudentHome();
        updateShareButtonStateStudentHome();
        draftModalStudent.style.display = 'none';
      }
      if (deleteButton) {
        const index = parseInt(deleteButton.dataset.index, 10);
        studentHomeDrafts.splice(index, 1);
        localStorage.setItem('studentHomeEmailDrafts', JSON.stringify(studentHomeDrafts));
        updateDraftCountStudentHome();
        displayDraftsStudentHome();
      }
    });
  }

  // Handle file selection
  fileInputStudent.addEventListener('change', (event) => {
    const files = Array.from(event.target.files);
    studentHomeFiles = [...studentHomeFiles, ...files];
    updateAttachedFilesDisplayStudentHome();
    updateShareButtonStateStudentHome();
  });

  // Update attached files display
  function updateAttachedFilesDisplayStudentHome() {
    attachedFilesDivStudent.innerHTML = '';
    studentHomePreviewUrls.forEach(url => URL.revokeObjectURL(url));
    studentHomePreviewUrls.clear();

    studentHomeFiles.forEach((file, index) => {
      const fileElement = document.createElement('div');
      fileElement.classList.add('file-item');

      let previewUrl, isImage, fileTypeClass;
      if (file.type.startsWith('image/')) {
        previewUrl = URL.createObjectURL(file);
        studentHomePreviewUrls.set(index, previewUrl);
        isImage = true;
        fileTypeClass = 'image';
      } else if (file.type === 'application/pdf') {
        previewUrl = '../Images/mail_Icons/pdf.png';
        isImage = false;
        fileTypeClass = 'pdf';
      } else if (file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
        previewUrl = '../Images/mail_Icons/docx.png';
        isImage = false;
        fileTypeClass = 'docx';
      } else {
        previewUrl = '../Images/mail_Icons/txt.png';
        isImage = false;
        fileTypeClass = 'generic';
      }

      const fileName = file.name.length > 20 ? file.name.substring(0, 17) + '...' : file.name;

      fileElement.innerHTML = `
        <div class="file-preview ${fileTypeClass}">
          <img src="${previewUrl}" alt="File preview" class="attached-img">
          <div class="file-overlay">
            <button type="button" class="view-file" data-index="${index}" data-is-image="${isImage}">
              <i class="fas fa-eye"></i>
            </button>
            <button type="button" class="remove-file" data-index="${index}">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <span class="file-name">${fileName}</span>
        </div>
      `;
      attachedFilesDivStudent.appendChild(fileElement);
    });

    // Event delegation for view and remove buttons
    attachedFilesDivStudent.addEventListener('click', (e) => {
      const viewButton = e.target.closest('.view-file');
      const removeButton = e.target.closest('.remove-file');

      if (viewButton) {
        const index = parseInt(viewButton.dataset.index, 10);
        const isImage = viewButton.dataset.isImage === 'true';
        const file = studentHomeFiles[index];

        if (isImage) {
          modalImageStudent.src = URL.createObjectURL(file);
          modalStudent.style.display = 'flex';
        } else {
          const url = URL.createObjectURL(file);
          window.open(url, '_blank');
          setTimeout(() => URL.revokeObjectURL(url), 0);
        }
      }

      if (removeButton) {
        const index = parseInt(removeButton.dataset.index, 10);
        if (studentHomePreviewUrls.has(index)) {
          URL.revokeObjectURL(studentHomePreviewUrls.get(index));
          studentHomePreviewUrls.delete(index);
        }
        studentHomeFiles.splice(index, 1);
        updateAttachedFilesDisplayStudentHome();
        updateShareButtonStateStudentHome();
      }
    });
  }

  // Save draft on page unload
  window.addEventListener('beforeunload', async () => {
    if (!isSendingStudentHome) {
      await saveDraftStudentHome();
    }
  });

  // Open draft modal
  draftButtonStudent.addEventListener('click', () => {
    displayDraftsStudentHome();
    draftModalStudent.style.display = 'flex';
  });

  // Close draft modal
  draftModalCloseStudent.addEventListener('click', () => {
    draftModalStudent.style.display = 'none';
  });

  draftModalStudent.addEventListener('click', (e) => {
    if (e.target === draftModalStudent) {
      draftModalStudent.style.display = 'none';
    }
  });

  // Close image modal
  modalCloseStudent.addEventListener('click', () => {
    modalStudent.style.display = 'none';
    URL.revokeObjectURL(modalImageStudent.src);
  });

  modalStudent.addEventListener('click', (e) => {
    if (e.target === modalStudent) {
      modalStudent.style.display = 'none';
      URL.revokeObjectURL(modalImageStudent.src);
    }
  });

  // Handle form submission
  formStudent.addEventListener('submit', async (event) => {
    event.preventDefault();
    isSendingStudentHome = true;
    try {
      await sendInternalMail(formStudent, studentHomeFiles, getCurrentStudentIdentity());
      studentHomeDrafts = studentHomeDrafts.filter(d => d.subject !== formStudent.querySelector('input[name="subject"]').value ||
                                              d.description !== formStudent.querySelector('textarea[name="description"]').value);
      localStorage.setItem('studentHomeEmailDrafts', JSON.stringify(studentHomeDrafts));
      updateDraftCountStudentHome();
      formStudent.reset();
      studentHomeFiles = [];
      updateAttachedFilesDisplayStudentHome();
      updateShareButtonStateStudentHome();
      alert('Mail sent inside the application.');
    } catch (error) {
      alert(`Mail failed: ${error.message}`);
    } finally {
      isSendingStudentHome = false;
    }
  });

  formStudent.querySelector('.inbox-btn').addEventListener('click', () => {
    const student = getCurrentStudentIdentity();
    loadMailbox(student.role, student.id, 'student-mailbox');
  });

  // Clear attached files on form reset
  formStudent.addEventListener('reset', () => {
    studentHomeFiles = [];
    studentHomePreviewUrls.forEach(url => URL.revokeObjectURL(url));
    studentHomePreviewUrls.clear();
    updateAttachedFilesDisplayStudentHome();
    updateShareButtonStateStudentHome();
  });

  // Initialize share button
  updateShareButtonStateStudentHome();

  // Set up share logic
  setupShareLogicCallback(studentHomeFiles);
}

// Share logic for Student Email
function setupShareMail(attachedFilesStudent) {
  const form = document.getElementById('studentEmailForm');
  const shareButton = form.querySelector('.share-btn');
  const shareModal = document.getElementById('share-modal-student');
  const closeModal = document.getElementById('share-modal-close-student');
  const shareConfirm = document.getElementById('share-confirm-student');
  const shareOptions = document.querySelectorAll('#share-modal-student .share-option');
  let selectedPlatform = null;

  async function convertToBase64Student(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('Failed to read file'));
      reader.readAsDataURL(file);
    });
  }

  shareButton.addEventListener('click', () => {
    const subject = form.querySelector('input[name="subject"]').value.trim();
    const description = form.querySelector('textarea[name="description"]').value.trim();
    if (!subject && !description && attachedFilesStudent.length === 0) {
      alert('Please add a subject, description, or file to share.');
      return;
    }
    if (!shareButton.disabled) {
      shareModal.style.display = 'flex';
    }
  });

  closeModal.addEventListener('click', () => {
    shareModal.style.display = 'none';
    selectedPlatform = null;
    shareOptions.forEach(option => option.classList.remove('selected'));
  });

  shareModal.addEventListener('click', (e) => {
    if (e.target === shareModal) {
      shareModal.style.display = 'none';
      selectedPlatform = null;
      shareOptions.forEach(option => option.classList.remove('selected'));
    }
  });

  shareOptions.forEach(option => {
    option.addEventListener('click', () => {
      shareOptions.forEach(opt => opt.classList.remove('selected'));
      option.classList.add('selected');
      selectedPlatform = option.getAttribute('data-platform');
    });
  });

  shareConfirm.addEventListener('click', async () => {
    if (!selectedPlatform) {
      alert('Please select a platform to share.');
      return;
    }

    const subject = form.querySelector('input[name="subject"]').value || 'No Subject';
    const description = form.querySelector('textarea[name="description"]').value || 'No Description';
    let shareText = `${subject}\n\n${description}`;

    let fileLinks = '';
    let filesToShare = [];
    if (attachedFilesStudent.length > 0) {
      fileLinks = '\n\nAttached Files:\n';
      filesToShare = await Promise.all(
        attachedFilesStudent.map(async file => {
          try {
            if (file.size > 5 * 1024 * 1024) {
              fileLinks += `${file.name}: [File too large to share]\n`;
              return null;
            }
            const fileDataUrl = await convertToBase64Student(file);
            fileLinks += `${file.name}: [Attachment]\n`;
            return { file, dataUrl: fileDataUrl };
          } catch (error) {
            console.error('Error converting file to data URL:', error);
            fileLinks += `${file.name}: [Error processing file]\n`;
            return null;
          }
        })
      );
      filesToShare = filesToShare.filter(file => file !== null);
    }

    shareText += fileLinks;

    switch (selectedPlatform) {
      case 'whatsapp':
        if (shareText.length > 2000) {
          alert('Content exceeds WhatsApp character limit (2000). Please shorten the message.');
          return;
        }
        if ('share' in navigator && filesToShare.length > 0) {
          const shareData = {
            title: subject,
            text: description,
            files: filesToShare.map(item => item.file)
          };
          try {
            await navigator.share(shareData);
          } catch (error) {
            console.error('Error sharing via Web Share API:', error);
            alert('Failed to share via WhatsApp. Please try again.');
          }
        } else {
          const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
          window.open(whatsappUrl, '_blank');
        }
        break;

      case 'x':
        if (shareText.length > 280) {
          alert('Content exceeds X character limit (280). Please shorten the message.');
          return;
        }
        const xUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(shareText)}`;
        window.open(xUrl, '_blank');
        break;

      case 'gmail':
        const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(shareText)}`;
        window.open(gmailUrl, '_blank');
        break;

      case 'outlook':
        const outlookUrl = `https://outlook.live.com/mail/0/deeplink/compose?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(shareText)}`;
        window.open(outlookUrl, '_blank');
        break;

      default:
        alert('Invalid platform selected.');
        return;
    }

    shareModal.style.display = 'none';
    selectedPlatform = null;
    shareOptions.forEach(option => option.classList.remove('selected'));
  });
}
